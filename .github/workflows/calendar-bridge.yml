# 🍓 캘린더 다리 안드로이드 앱(AI-비서/calendar-bridge)을 무료로 만들어요.
# - 앱 코드가 바뀌면 어느 브랜치든 만들어 봐요(잘 만들어지는지 확인).
# - main에 들어오면 GitHub 릴리스 'calendar-bridge'에 올려요 → 받는 주소는 늘 같아요:
#   https://github.com/berryst41/toy-store/releases/download/calendar-bridge/calendar-bridge.apk
# - 서명 열쇠는 GitHub Secrets의 CALBRIDGE_KEYSTORE(열쇠 파일을 base64 글자로 바꾼 것) 하나예요.
#   열쇠가 없으면 시험용(debug)으로만 만들고 릴리스에는 안 올려요. 열쇠를 바꾸면 앱을 지우고 다시 깔아야 해요.
name: 캘린더 다리 앱

on:
  push:
    paths: ['AI-비서/calendar-bridge/**', '.github/workflows/calendar-bridge.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: calendar-bridge-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      HAS_KEY: ${{ secrets.CALBRIDGE_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 한글 폴더 이름이 빌드를 헷갈리게 하지 않도록 영어 이름 폴더로 옮겨서 만들어요
      - name: 앱 만들기
        env:
          KEYSTORE_B64: ${{ secrets.CALBRIDGE_KEYSTORE }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cp -r "AI-비서/calendar-bridge" "$RUNNER_TEMP/cb"
          cd "$RUNNER_TEMP/cb"
          VER=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          echo "VER=$VER" >> "$GITHUB_ENV"
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/calbridge.p12"
            KEYSTORE_FILE="$RUNNER_TEMP/calbridge.p12" gradle assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/calendar-bridge.apk"
          else
            echo "::warning::CALBRIDGE_KEYSTORE 열쇠가 없어서 시험용으로만 만들어요"
            gradle assembleDebug --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/calendar-bridge.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: calendar-bridge-apk
          path: ${{ runner.temp }}/calendar-bridge.apk

      - name: 받는 곳(릴리스)에 올리기 — main이고 열쇠가 있을 때만
        if: github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="🍓 캘린더 다리 v$VER (빌드 ${{ github.run_number }}, $(date -u +%F)) — 폰의 모든 캘린더를 AI 딸기로 보내는 앱. 설치법: https://github.com/berryst41/toy-store/blob/main/AI-%EB%B9%84%EC%84%9C/calendar-bridge/README.md"
          gh release view calendar-bridge >/dev/null 2>&1 || gh release create calendar-bridge --title "🍓 캘린더 다리" --notes "$NOTES" --latest=false
          gh release edit calendar-bridge --title "🍓 캘린더 다리 v$VER" --notes "$NOTES"
          gh release upload calendar-bridge "$RUNNER_TEMP/calendar-bridge.apk" --clobber
