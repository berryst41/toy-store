<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- AI berryst 아이콘: 딸기 로봇 (가운데 80% 안에 그려서 동그랗게 잘려도 괜찮아요) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#fff4f6"/>
      <stop offset="1" stop-color="#ffd9e1"/>
    </radialGradient>
    <linearGradient id="berry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a6e"/>
      <stop offset="1" stop-color="#e0263f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 안테나 -->
  <line x1="256" y1="96" x2="256" y2="132" stroke="#5b4fd6" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="88" r="15" fill="#ffd43b" stroke="#5b4fd6" stroke-width="6"/>
  <!-- 팔 -->
  <path d="M120 300 q-38 10 -40 52" fill="none" stroke="#9aa3b5" stroke-width="16" stroke-linecap="round"/>
  <circle cx="80" cy="358" r="16" fill="#c7cdd9"/>
  <path d="M392 300 q38 10 40 52" fill="none" stroke="#9aa3b5" stroke-width="16" stroke-linecap="round"/>
  <circle cx="432" cy="358" r="16" fill="#c7cdd9"/>
  <!-- 딸기 몸통 -->
  <path d="M256 430 C175 420 112 352 112 262 C112 190 172 150 256 150 C340 150 400 190 400 262 C400 352 337 420 256 430 Z" fill="url(#berry)"/>
  <!-- 딸기 꼭지 -->
  <path d="M256 168 L214 128 L240 150 L222 112 L256 146 L290 112 L272 150 L298 128 Z" fill="#2f9e44"/>
  <path d="M180 160 q76 -34 152 0 q-30 22 -76 22 q-46 0 -76 -22 Z" fill="#40c057"/>
  <!-- 씨 -->
  <g fill="#ffe08a">
    <ellipse cx="160" cy="250" rx="6" ry="9"/><ellipse cx="352" cy="250" rx="6" ry="9"/>
    <ellipse cx="150" cy="320" rx="6" ry="9"/><ellipse cx="362" cy="320" rx="6" ry="9"/>
    <ellipse cx="200" cy="380" rx="6" ry="9"/><ellipse cx="312" cy="380" rx="6" ry="9"/>
    <ellipse cx="256" cy="404" rx="6" ry="9"/>
  </g>
  <!-- 로봇 얼굴 화면 -->
  <rect x="166" y="212" width="180" height="120" rx="34" fill="#2b2547"/>
  <!-- 눈 -->
  <circle cx="218" cy="262" r="17" fill="#7cf5ff"/>
  <circle cx="294" cy="262" r="17" fill="#7cf5ff"/>
  <circle cx="223" cy="256" r="6" fill="#fff"/>
  <circle cx="299" cy="256" r="6" fill="#fff"/>
  <!-- 입 -->
  <path d="M232 298 q24 18 48 0" fill="none" stroke="#7cf5ff" stroke-width="8" stroke-linecap="round"/>
  <!-- 볼 -->
  <circle cx="186" cy="304" r="10" fill="#ff8fa3" opacity=".8"/>
  <circle cx="326" cy="304" r="10" fill="#ff8fa3" opacity=".8"/>
</svg>
